---
# tasks file for roles/niri
- name: Set path variables
  ansible.builtin.set_fact:
    niri_role_files: "{{ role_path }}/files"
    niri_user_config: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/niri"

- name: Ensure Niri directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ niri_role_files }}"
    - "{{ niri_user_config }}"

- name: Find all existing config files
  ansible.builtin.find:
    path: "{{ niri_user_config }}"
    hidden: yes
    recurse: yes
    file_type: file
  register: local_niri_files

- name: Import unmanaged ~/.config/niri files into roles/niri/files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ niri_role_files }}/{{ item.path | relpath(niri_user_config) }}"
    remote_src: yes
    force: no
    mode: '0644'
  loop: "{{ local_niri_files.files }}"
  loop_control:
    label: "{{ item.path | relpath(niri_user_config) }}"

- name: Find all tracked files in roles/niri/files
  ansible.builtin.find:
    paths: "{{ niri_role_files }}"
    hidden: yes
    recurse: yes
    file_type: file
  register: role_niri_files

- name: Ensure subdirectories exist in ~/.config/niri
  ansible.builtin.file:
    path: "{{ niri_user_config }}/{{ item.path | relpath(niri_role_files) | dirname }}"
    state: directory
    mode: '0755'
  loop: "{{ role_niri_files.files }}"
  when:
    - "(item.path | relpath(niri_role_files) | dirname) != '.' "
    - "(item.path | relpath(niri_role_files) | dirname) != '' "
  loop_control:
    label: "{{ item.path | relpath(niri_role_files) | dirname }}"

- name: Create symlink from ~/.config/niri to role files
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ niri_user_config }}/{{ item.path | relpath(niri_role_files) }}"
    state: link
    force: yes
  loop: "{{ role_niri_files.files }}"
  loop_control:
    label: "{{ item.path | relpath(niri_role_files) }}"