---
# tasks file for roles/noctalia
- name: Set path variables
  ansible.builtin.set_fact:
    noctalia_role_files: "{{ role_path }}/files"
    noctalia_user_config: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/noctalia"

- name: Ensure Noctalia directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ noctalia_role_files }}"
    - "{{ noctalia_user_config }}"

- name: Find all existing config files
  ansible.builtin.find:
    paths: "{{ noctalia_user_config }}"
    hidden: yes
    recurse: yes
    file_type: file
  register: local_noctalia_files

- name: Import unmanaged ~/.config/noctalia files into roles/noctalia/files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ noctalia_role_files }}/{{ item.path | relpath(noctalia_user_config) }}"
    remote_src: yes
    force: no
    mode: '0644'
  loop: '{{ local_noctalia_files.files }}'
  loop_control:
    label: "{{ item.path | relpath(noctalia_user_config) }}"

- name: Find all tracked files in roles/noctalia/files
  ansible.builtin.find:
    paths: "{{ noctalia_role_files }}"
    hidden: yes
    recurse: yes
    file_type: file
  register: role_noctalia_files

- name: Ensure subdirectories exist in ~/.config/noctalia
  ansible.builtin.file:
    path: "{{ noctalia_user_config }}/{{ item.path | relpath(noctalia_role_files) | dirname }}"
    state: directory
    mode: '0755'
  loop: "{{ role_noctalia_files.files }}"
  when:
    - "(item.path | relpath(noctalia_role_files) | dirname) != '.' "
    - "(item.path | relpath(noctalia_role_files) | dirname) != '' "
  loop_control:
    label: "{{ item.path | relpath(noctalia_role_files) | dirname }}"

- name: Create symlink from ~/.config/noctalia to role files
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ noctalia_user_config }}/{{ item.path | relpath(noctalia_role_files) }}"
    state: link
    force: yes
  loop: "{{ role_noctalia_files.files }}"
  loop_control:
    label: "{{ item.path | relpath(noctalia_role_files) }}"